name: Mise à jour des oraux

on:
  # Toutes les 10 minutes
  schedule:
    - cron: '*/10 * * * *'
  # Déclenché manuellement depuis l'onglet Actions
  workflow_dispatch:
  # Déclenché par un push sur main (après auto-merge)
  push:
    branches: [main]
    paths-ignore:
      - 'data/oraux_ricci.json'  # éviter la boucle infinie

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch schedule data
        run: python scripts/fetch_schedule.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oraux_ricci.json
          if git diff --cached --quiet; then
            echo "Aucun changement détecté."
          else
            git commit -m "⏰ Auto: mise à jour des oraux de Ricci"
            git push origin main
          fi

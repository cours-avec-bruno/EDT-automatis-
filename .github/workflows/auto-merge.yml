name: Auto-merge vers main

on:
  push:
    branches:
      - 'claude/automated-exam-schedule-cGYq1'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge vers main
        run: |
          git checkout main
          git pull origin main --rebase
          git merge --no-ff origin/claude/automated-exam-schedule-cGYq1 \
            -m "🔀 Auto-merge: mise à jour de l'EDT"
          git push origin main
